  <h1>Contact Me</h1>
  
  <form action="mailto:adwfw9@umsystem.edu?Subject=Contact%20Submission" method="post" enctype="text/plain">
    <div>
      <label for="title">Title</label>
      <select id="title" name="title" required>
        <option value="" disabled selected>Please select a title</option>
        <option value="Mr.">Mr.</option>
        <option value="Ms.">Ms.</option>
        <option value="Dr.">Dr.</option>
        <option value="Mrs.">Mrs.</option>
      </select>
    </div>
    <div>
      <label for="name">Name</label>
      <input type="text" id="name" name="name" placeholder="Please enter your full name" required>
    </div>
    <div>
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="Please enter your email" required>
    </div>
    <div>
      <label for="message">Message</label>
      <textarea id="message" name="message" rows="4" placeholder="Please enter your message" required></textarea>
    </div>
    <div>
      <label for="sender">I am a...</label>
      <select id="sender" name="sender" required>
        <option value="" disabled selected>Please select an option</option>
        <option value="Recruiter">Recruiter</option>
        <option value="Professor">Professor</option>
        <option value="Student">Student</option>
        <option value="Other">Other</option>
      </select>
    </div>
    <button type="submit" class="submit">Submit</button>
  </form>
